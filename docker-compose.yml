# poly-coin-test: 멀티 프로세스 아키텍처
# P1(rtds) + P2(binance_ws) + P4(paper_trader) + multi_exchange_stream

services:
  # ============================================================================
  # Database
  # ============================================================================
  paper_trade_db:
    image: postgres:15-alpine
    container_name: cointest-paper-trade-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: papertrade
      POSTGRES_DB: paper_trade
    volumes:
      - ./paper_trade_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper_trade"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis (대시보드 + 프로세스간 IPC pub/sub)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: cointest-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # P1: RTDS (Real-Time Data Service)
  # - Polymarket CLOB WebSocket: 오더북 실시간 수집
  # - Polymarket RTDS WebSocket: Binance/Chainlink 실시간 가격
  # - Chainlink REST API: 가격 수집 fallback (10초마다)
  # - Redis pub/sub: ch:orderbook:*, ch:candle_boundary publish
  # ============================================================================
  rtds:
    build:
      context: .
      dockerfile: services/rtds/Dockerfile
    container_name: cointest-rtds
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ============================================================================
  # P2: Binance WebSocket
  # - miniTicker: 실시간 가격
  # - kline_1m: 1분봉 OHLCV
  # - Redis pub/sub: ch:candle:* publish
  # ============================================================================
  binance_ws:
    build:
      context: .
      dockerfile: services/binance_ws/Dockerfile
    container_name: cointest-binance-ws
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 디버깅용 텔레그램 (open 가격 전송)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ============================================================================
  # P4: Paper Trader - V12.5 전략
  # - Redis subscribe: ch:orderbook:*, ch:candle_boundary
  # - Event-driven 전략 실행 (v12_5)
  # - 60초 주기 정산
  # - 기본 실행됨 (profiles 없음)
  # ============================================================================
  paper_trader_v12_5:
    build:
      context: .
      dockerfile: services/paper_trader/Dockerfile
    container_name: cointest-paper-trader-v12-5
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtds:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      # 인프라 (컨테이너 네트워크)
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 전략 선택 (파라미터는 strategy_config 기본값 사용)
      STRATEGY_NAME: v12_5
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ============================================================================
  # P4: Paper Trader - V12.6 전략 (Momentum Match)
  # - V12.5 기반 + delta 방향 == distance 방향 체크
  # - ~90% 승률 목표
  # ============================================================================
  paper_trader_v12_6:
    build:
      context: .
      dockerfile: services/paper_trader/Dockerfile
    container_name: cointest-paper-trader-v12-6
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtds:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      # 인프라 (컨테이너 네트워크)
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 전략 선택 (파라미터는 strategy_config 기본값 사용)
      STRATEGY_NAME: v12_6
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ============================================================================
  # real_trader_cross_limit_hedge: Crossing 전략 (횟수 제한 + 헤지)
  # - BTC only, 15분봉 전체 진입
  # - 1회차: 4 contracts, 2~9회차: 8 contracts, 10회차: 4 contracts
  # - GTC 고정 0.70
  # ============================================================================
  real_trader_cross_limit_hedge:
    build:
      context: .
      dockerfile: services/real_trader_cross_limit_hedge/Dockerfile
    container_name: cointest-real-trader-cross-limit-hedge
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtds:
        condition: service_started
      binance_ws:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      # 인프라 (컨테이너 네트워크)
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Credentials (.env에서 가져옴)
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY:-}
      POLYMARKET_PROXY_ADDRESS: ${POLYMARKET_PROXY_ADDRESS:-}
      # V2: Builder code (선택). Builder 프로그램 등록한 경우만.
      POLYMARKET_BUILDER_CODE: ${POLYMARKET_BUILDER_CODE:-}
      # V2 검증용 (선택, 4/28 이전): https://clob-v2.polymarket.com
      POLYMARKET_HOST: ${POLYMARKET_HOST:-https://clob.polymarket.com}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      # 전략 파라미터는 config.py 기본값 사용
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    profiles:
      - real  # docker compose --profile real up 으로 실행

  # ============================================================================
  # Claimer: Auto-claim resolved Polymarket positions
  # - 별도 프로세스로 resolved trades claim
  # - Builder Relayer를 통해 redeemPositions 호출
  # ============================================================================
  claimer:
    build:
      context: .
      dockerfile: services/claimer/Dockerfile
    container_name: cointest-claimer
    environment:
      PYTHONUNBUFFERED: "1"
      # Builder API (claim용) - 필수
      BUILDER_API_KEY_1: ${BUILDER_API_KEY_1:-}
      BUILDER_SECRET_1: ${BUILDER_SECRET_1:-}
      BUILDER_PASS_PHRASE_1: ${BUILDER_PASS_PHRASE_1:-}
      # Account 1 - 필수
      ACCOUNT_1_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY:-}
      ACCOUNT_1_PROXY_ADDRESS: ${POLYMARKET_PROXY_ADDRESS:-}
      ACCOUNT_1_NAME: main
      # 설정
      CLAIM_INTERVAL: 3600
      # V2: redeemPositions의 collateralToken 오버라이드 (선택).
      # 기본값 USDC.e (V1, cutover 이전 마켓). cutover 이후 새 마켓은 pUSD 사용 필요.
      CLAIM_COLLATERAL_ADDRESS: ${CLAIM_COLLATERAL_ADDRESS:-}
      # V2 검증용 (선택, 4/28 이전): https://clob-v2.polymarket.com
      POLYMARKET_HOST: ${POLYMARKET_HOST:-https://clob.polymarket.com}
      # Telegram 알림
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
    restart: unless-stopped
    profiles:
      - real  # docker compose --profile real up 으로 실행

  # ============================================================================
  # Multi Exchange Stream (Bybit, Gate, Bitget)
  # - ccxt.pro WebSocket으로 실시간 가격/오더북 수집
  # - exchange_prices 테이블에 저장
  # - Redis에 실시간 캐싱
  # ============================================================================
  multi_exchange_stream:
    build:
      context: .
      dockerfile: services/multi_exchange_stream/Dockerfile
    container_name: cointest-multi-exchange
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped

  # ============================================================================
  # Paper Trader Cross Limit 5M: 5분봉 Crossing 전략 (횟수 제한)
  # - real_trader_cross_limit_hedge와 동일한 로직
  # - 1회차: 10, 2-9회차: 20, 10회차: 10 (taker 체결)
  # ============================================================================
  paper_trader_cross_limit_5m:
    build:
      context: .
      dockerfile: services/paper_trader_cross_limit_5m/Dockerfile
    container_name: cointest-paper-trader-cross-limit-5m
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtds:
        condition: service_started
      binance_ws:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Paper Trader Cross Limit 15M: 15분봉 Crossing 전략 (횟수 제한)
  # - real_trader_cross_limit_hedge와 동일한 로직
  # - 1회차: 10, 2-9회차: 20, 10회차: 10 (taker 체결)
  # ============================================================================
  paper_trader_cross_limit_15m:
    build:
      context: .
      dockerfile: services/paper_trader_cross_limit_15m/Dockerfile
    container_name: cointest-paper-trader-cross-limit-15m
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtds:
        condition: service_started
      binance_ws:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Real Trader 5M Cross Front: 5분봉 초반 Crossing 전략
  # - 0초~3분까지 진입 (CUTOFF_MINUTES 파라미터)
  # - 10회 제한, 밸런싱 없음
  # - GTC 0.80
  # ============================================================================
  real_trader_5m_cross_front:
    build:
      context: .
      dockerfile: services/real_trader_5m_cross_front/Dockerfile
    container_name: cointest-real-trader-5m-cross-front
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtds:
        condition: service_started
      binance_ws:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      # 인프라 (컨테이너 네트워크)
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Credentials (.env에서 가져옴)
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY:-}
      POLYMARKET_PROXY_ADDRESS: ${POLYMARKET_PROXY_ADDRESS:-}
      # V2: Builder code (선택). Builder 프로그램 등록한 경우만.
      POLYMARKET_BUILDER_CODE: ${POLYMARKET_BUILDER_CODE:-}
      # V2 검증용 (선택, 4/28 이전): https://clob-v2.polymarket.com
      POLYMARKET_HOST: ${POLYMARKET_HOST:-https://clob.polymarket.com}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      # 전략 파라미터
      CUTOFF_MINUTES: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    profiles:
      - real  # docker compose --profile real up 으로 실행

  # ============================================================================
  # Real Trader 5M Improve: cooltime + pending 로직 적용
  # - 거래 후 1초 cooltime, cooltime 중 마지막 crossing만 저장
  # - cooltime 종료 후 반대 방향이면 실행
  # - GTC 0.80 고정
  # ============================================================================
  real_trader_5m_improve:
    build:
      context: .
      dockerfile: services/real_trader_5m_improve/Dockerfile
    container_name: cointest-real-trader-5m-improve
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtds:
        condition: service_started
      binance_ws:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      # 인프라 (컨테이너 네트워크)
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Credentials (.env에서 가져옴)
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY:-}
      POLYMARKET_PROXY_ADDRESS: ${POLYMARKET_PROXY_ADDRESS:-}
      # V2: Builder code (선택). Builder 프로그램 등록한 경우만.
      POLYMARKET_BUILDER_CODE: ${POLYMARKET_BUILDER_CODE:-}
      # V2 검증용 (선택, 4/28 이전): https://clob-v2.polymarket.com
      POLYMARKET_HOST: ${POLYMARKET_HOST:-https://clob.polymarket.com}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    profiles:
      - real  # docker compose --profile real up 으로 실행

  # ============================================================================
  # Paper Trader 15M Late: STRATEGY.md 15분봉 후반(11분~) 전략
  # - 진입: 660초(11분) ~ 880초(14분40초)
  # - 헤지: 880초 ~ 890초 (14분50초)
  # - Max5 + 속도필터(20초/3회)
  # ============================================================================
  paper_trader_15m_late:
    build:
      context: .
      dockerfile: services/paper_trader_15m_late/Dockerfile
    container_name: cointest-paper-trader-15m-late
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtds:
        condition: service_started
      binance_ws:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Paper Trader 1H Late: STRATEGY.md 1시간봉 후반(56분~) 전략
  # - 진입: 3360초(56분) ~ 3590초(59분50초)
  # - 헤지: 3590초 ~ 3600초
  # - Max5 + 속도필터(20초/3회)
  # ============================================================================
  paper_trader_1h_late:
    build:
      context: .
      dockerfile: services/paper_trader_1h_late/Dockerfile
    container_name: cointest-paper-trader-1h-late
    depends_on:
      paper_trade_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtds:
        condition: service_started
      binance_ws:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: paper_trade_db
      DB_PORT: 5432
      DB_NAME: paper_trade
      DB_USER: paper
      DB_PASSWORD: papertrade
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Latency Monitor: Redis pub/sub 지연 시간 측정
  # - Binance event time vs 현재 시간 비교
  # - crossing/candle 이벤트 latency 출력
  # ============================================================================
  latency_monitor:
    build:
      context: ./services/latency_monitor
      dockerfile: Dockerfile
    container_name: cointest-latency-monitor
    depends_on:
      redis:
        condition: service_healthy
      binance_ws:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
    restart: "no"  # 테스트용이므로 재시작 안 함
    profiles:
      - test  # docker compose --profile test up latency_monitor

  # ============================================================================
  # Dozzle: Docker 로그 뷰어
  # ============================================================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: cointest-dozzle
    ports:
      - "3841:8080"
    environment:
      DOZZLE_BASE: /logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
